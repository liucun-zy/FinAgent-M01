[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "action-trace-demo"
version = "0.2.0"
description = "A candidate-only DeliverBench research agent with auditable claim and artifact edits"
requires-python = ">=3.12"
dependencies = [
  "openai>=2", "python-docx>=1", "openpyxl>=3", "python-pptx>=1",
  "pypdf>=5", "fonttools>=4", "reportlab>=4", "httpx>=0.27", "jsonschema>=4",
  "pydantic==2.14.3", "langextract==1.7.2",
  "lxml>=5", "markdown-it-py>=3,<5",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
action-trace = "action_trace_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
